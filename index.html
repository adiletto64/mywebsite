<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Adilet — Favorites</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap"
    rel="stylesheet"
  />

  <!-- Latest Bootstrap 5.3.9 CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
    rel="stylesheet"
    crossorigin="anonymous"
  />

  <!-- Three.js Import Map (for 3D Desktop Globe) -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
      }
    }
  </script>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- Clean Fine Paper Grain Overlay (Generated Canvas Noise) -->
  <div id="grainOverlay" class="grain-overlay" aria-hidden="true"></div>

  <!-- Big Circular Spotlight & Blurred Shadow Overlay (Darkens Shadow Side + Posters in Shadow) -->
  <div class="spotlight-shadow-overlay" aria-hidden="true"></div>

  <!-- ================= 3D SCROLL-DRIVEN DESK -> GLOBE TRACK ================= -->
  <section id="deskScrollTrack" class="desk-scroll-track">
    <div class="desk-sticky-viewport">
      <!-- Layer 1: Top-Down Poster Table (tilts into 3D side-view on scroll) -->
      <div id="tablePerspectiveWrap" class="table-perspective-wrap">
        <div class="page-shell mx-auto">
          <div id="tableStage" class="table-stage">
            <!-- Subtle Cluster Labels -->
            <span class="cluster-tag tag-books" aria-hidden="true">books</span>
            <span class="cluster-tag tag-series" aria-hidden="true">series</span>
            <span class="cluster-tag tag-movies" aria-hidden="true">movies</span>

            <!-- Center Title (among the posters, partially overlapped) -->
            <header class="center-note">
              <h1 id="heroName" class="hero-name mb-1" aria-label="Books, Movies, Series">Books, Movies, Series</h1>
              <p class="hero-sub mb-0">explore to know about me</p>
            </header>
          </div>
        </div>
      </div>

      <!-- Layer 2: 3D Desktop Globe (slides right-to-left on the same table & focuses on Northern Hemisphere) -->
      <div id="globeStageWrap" class="globe-stage-wrap" aria-label="Interactive 3D Globe focused on the Northern Hemisphere">
        <div id="globeCanvasHost" class="globe-canvas-host"></div>

        <!-- Tooltip shown when hovering the 3D pushpin on the globe -->
        <div id="globePinTooltip" class="globe-pin-tooltip" aria-hidden="true">
          <div class="pin-tooltip-title">Кыргызстан</div>
          <div class="pin-tooltip-desc">Сердце Центральной Азии — горы Тянь-Шаня, Иссык-Куль и Памир-Алай. Прокрути ниже к карте.</div>
        </div>

        <div id="globeHud" class="globe-hud">
          <span class="globe-kicker">northern hemisphere</span>
          <p class="globe-hint mb-2">drag to spin the globe</p>
          <a href="#kyrgyzstanSection" class="globe-down-link">kyrgyzstan map &darr;</a>
        </div>
      </div>
    </div>
  </section>

  <!-- ================= SCROLL-DOWN SECTION: KYRGYZSTAN MAP ================= -->
  <div class="page-shell mx-auto">
    <section id="kyrgyzstanSection" class="kg-map-section" aria-label="Map of Kyrgyzstan">
      <div class="kg-map-header text-center mb-4">
        <span class="kg-map-kicker">places</span>
        <h2 class="kg-map-title mb-0">Kyrgyzstan</h2>
      </div>

      <div class="kg-map-sheet mx-auto">
        <div id="kgMapFrame" class="kg-map-frame">
          <img
            id="kgMapImg"
            src="https://upload.wikimedia.org/wikipedia/commons/7/77/Kyrgyzstan_adm_location_map.svg"
            alt="Map of Kyrgyzstan"
            class="kg-map-img"
            referrerpolicy="no-referrer"
            draggable="false"
          />
          <!-- 7 Red Pushpins injected by js/app.js -->
        </div>
      </div>
    </section>
  </div>

  <!-- Flying Poster Element for Smooth Move-to-Center & Straighten Animation -->
  <div id="flyingPoster" class="flying-poster" aria-hidden="true">
    <img id="flyingPosterImg" src="" alt="" referrerpolicy="no-referrer" />
  </div>

  <!-- Borderless Editorial Detail Overlay (Poster Slot Left + Blurred Text Panel Right) -->
  <div id="detailOverlay" class="detail-overlay" aria-hidden="true">
    <div class="detail-inner container">
      <div class="row align-items-center justify-content-center g-4 g-md-5">
        <div class="col-12 col-md-5 d-flex justify-content-center justify-content-md-end">
          <div id="detailPosterSlot" class="detail-poster-slot"></div>
        </div>
        <div class="col-12 col-md-7 d-flex justify-content-center justify-content-md-start">
          <div id="detailTextPanel" class="detail-text-panel">
            <button id="closeDetailBtn" type="button" class="btn-close-detail" aria-label="Close details">
              &times;
            </button>
            <p id="detailKicker" class="detail-kicker mb-1"></p>
            <h2 id="detailTitle" class="detail-title mb-1"></h2>
            <p id="detailOriginal" class="detail-original mb-2 d-none"></p>
            <p id="detailCreator" class="detail-creator mb-3"></p>
            <p id="detailDescription" class="detail-description mb-3"></p>
            <div id="detailGenres" class="d-flex flex-wrap gap-2"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Latest Bootstrap 5.3.9 JS Bundle -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"
    crossorigin="anonymous"
  ></script>

  <!-- Main App Script -->
  <script src="js/app.js"></script>

  <!-- 3D Globe & Smooth Side-Camera Scroll Transition -->
  <script type="module" src="js/globe.js"></script>
</body>
</html>
